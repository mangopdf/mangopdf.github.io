<details class="expand">
  <summary class="expand-summary">
    <span class="expand-chevron" aria-hidden="true"></span>
    <span class="expand-title">{{ .Get 0 }}</span>
  </summary>
  <div class="expand-inner">
    {{ .Inner | markdownify | safeHTML }}
  </div>
</details>
{{ if not (.Page.Store.Get "expand-js") }}
{{ .Page.Store.Set "expand-js" true }}
<script>
(function () {
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  document.querySelectorAll("details.expand").forEach(function (el) {
    var summary = el.querySelector("summary");
    var inner = el.querySelector(".expand-inner");
    summary.addEventListener("click", function (e) {
      e.preventDefault();
      if (reduceMotion.matches) {
        el.open = !el.open;
        return;
      }
      if (el.open) {
        inner.style.height = inner.scrollHeight + "px";
        inner.style.overflow = "hidden";
        requestAnimationFrame(function () {
          inner.style.transition =
            "height 0.28s ease-out" +
            ", padding-bottom 0.28s ease-out" +
            ", transform 0.28s ease-out" +
            ", opacity 0.22s ease-out";
          inner.style.height = "0";
          inner.style.paddingBottom = "0";
          inner.style.opacity = "0";
          inner.style.transform = "translateY(-10px)";
        });
        inner.addEventListener("transitionend", function done(ev) {
          if (ev.target !== inner || ev.propertyName !== "height") return;
          el.open = false;
          inner.style.cssText = "";
          inner.removeEventListener("transitionend", done);
        });
      } else {
        el.open = true;
        var pad = getComputedStyle(inner).paddingBottom;
        var target = inner.scrollHeight;
        inner.style.height = "0";
        inner.style.paddingBottom = "0";
        inner.style.opacity = "0";
        inner.style.transform = "translateY(-10px)";
        inner.style.overflow = "hidden";
        requestAnimationFrame(function () {
          inner.style.transition =
            "height 0.28s ease-out" +
            ", padding-bottom 0.28s ease-out" +
            ", transform 0.28s ease-out" +
            ", opacity 0.22s ease-out 0.06s";
          inner.style.height = target + "px";
          inner.style.paddingBottom = pad;
          inner.style.opacity = "1";
          inner.style.transform = "none";
        });
        inner.addEventListener("transitionend", function done(ev) {
          if (ev.target !== inner || ev.propertyName !== "height") return;
          inner.style.cssText = "";
          inner.removeEventListener("transitionend", done);
        });
      }
    });
  });
})();
</script>
{{ end }}
