baseURL: "https://mango.pdf.zone/"
disablePathToLower: true
disableKinds: [taxonomy, term, section]
enableRobotsTXT: true
locale: en-us
title: mango.pdf.zone
# SCSS and processed image sources live in assets/ so the dev server watches
# them as assets and re-runs the Sass/image pipeline on change.
module:
  mounts:
    - source: assets
      target: assets
    - source: static
      target: static
      files:
        - '! node_modules/**'
        - '! node_modules'
        - '! package.json'
        - '! package-lock.json'
markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      unsafe: true
      xHTML: true
